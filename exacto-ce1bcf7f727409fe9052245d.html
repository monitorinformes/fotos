<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor de Fondos</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
/* Concepto: tablero de tesorería para el CFO. Primero el resumen y las alarmas, después la tabla comparativa y, al abrir un fondo, la evidencia (pares, flujos, composición, duración). */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --ink:#13202B; --ink-2:#44545F; --ink-3:#5A6976;
  --line:#D5DDE5; --accent:#0B5C7A; --accent-ink:#FFFFFF; --series-b:#7C8A97;
  --ok:#17703F; --ok-bg:#E1F2E8; --warn:#8F5A00; --warn-bg:#FBEFD5; --crit:#B3261E; --crit-bg:#FBE3E0;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#151F28; --surface-2:#1C2833; --ink:#E6EDF3; --ink-2:#B3C0CC; --ink-3:#93A2B0;
    --line:#2A3846; --accent:#5BB8DB; --accent-ink:#06222E; --series-b:#8FA0AF;
    --ok:#5BD08F; --ok-bg:#12301F; --warn:#F0B64D; --warn-bg:#33270F; --crit:#FF8A80; --crit-bg:#3A1816;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D; --surface:#151F28; --surface-2:#1C2833; --ink:#E6EDF3; --ink-2:#B3C0CC; --ink-3:#93A2B0;
  --line:#2A3846; --accent:#5BB8DB; --accent-ink:#06222E; --series-b:#8FA0AF;
  --ok:#5BD08F; --ok-bg:#12301F; --warn:#F0B64D; --warn-bg:#33270F; --crit:#FF8A80; --crit-bg:#3A1816;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13px;color:var(--ink-2)}
p{margin:0}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Encabezado */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--surface);color:var(--ink-2)}
.badge.foto{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.status{font-size:12px;color:var(--ink-3);min-height:18px}

/* Resumen */
.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.tile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tile b{font-size:22px;font-weight:600;font-family:var(--mono);line-height:1}
.tile span.l{font-size:12px;color:var(--ink-2)}
.ctx{margin-top:12px;font-size:12px;color:var(--ink-3);display:flex;gap:6px 16px;flex-wrap:wrap}
.alerts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--surface-2)}
.alerts li .t{min-width:0}
.alerts li strong{font-weight:600}

/* Señales (forma + texto, nunca solo color) */
.sg{display:inline-block;width:11px;height:11px;flex:none;vertical-align:-1px}
.sg.s0{background:var(--ok);border-radius:50%}
.sg.s1{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%)}
.sg.s2{background:var(--crit);border-radius:1px}
.sg.sn{border:2px solid var(--ink-3);border-radius:50%;width:11px;height:11px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.s0{background:var(--ok-bg);color:var(--ok)}
.pill.s1{background:var(--warn-bg);color:var(--warn)}
.pill.s2{background:var(--crit-bg);color:var(--crit)}
.pill.sn{background:var(--surface-2);color:var(--ink-2)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* Tabla */
.group{display:flex;flex-direction:column;gap:8px}
.group>header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;container-type:inline-size}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:960px;font-size:13px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.patc{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface)}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
.sa{font-size:.9em}.sa.off{opacity:.35}th button:hover .sa.off{opacity:.8}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px;max-width:250px;white-space:normal;padding-left:12px}
tr:last-child>td{border-bottom:0}
.rowbtn{background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.rowbtn .nm{font-weight:600;display:flex;gap:6px;align-items:center}
.rowbtn .sub{font-size:12px;color:var(--ink-3)}
.rowbtn .chev{display:inline-block;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s;flex:none}
.rowbtn[aria-expanded="true"] .chev{transform:rotate(45deg)}
td.best{font-weight:600}
td.best::after{content:"▲";font-size:8px;margin-left:4px;color:var(--accent);vertical-align:2px}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:flex-start}
td.chipcell{white-space:normal;text-align:left}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.dl{font-size:11px;color:var(--ink-2)}
.dl.big{color:var(--crit);font-weight:600}
.chip.al{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;font-weight:500;color:var(--ink-3);margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
tr.detail>td{background:var(--bg);padding:14px 0;white-space:normal;text-align:left;position:static;max-width:none}
tr.detail .dgrid{padding:0 12px}
tr.err td{color:var(--crit)}
.dwrap{position:sticky;left:0;width:calc(100vw - 2*max(16px,env(safe-area-inset-left,0px)) - 2px);max-width:1150px}
@supports (width:1cqw){.dwrap{width:100cqw;max-width:none}}

/* Detalle */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.box h3{margin-bottom:8px}
.conds{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.conds li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.conds .v{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;padding-left:8px}
.verdict{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px}
.mini{width:100%;border-collapse:collapse;min-width:0;font-size:12px}
.mini th,.mini td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;position:static;background:none;text-transform:none;letter-spacing:0;font-size:12px}
.mini th{color:var(--ink-3);font-weight:500}
.mini th:first-child,.mini td:first-child{text-align:left;min-width:0;max-width:none;white-space:normal}
.bar2{display:flex;flex-direction:column;gap:2px;min-width:90px}
.bar2 i{display:block;height:4px;border-radius:2px;background:var(--accent)}
.bar2 i.b{background:var(--series-b)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
svg.ch text.v{fill:var(--ink);font-weight:500}
svg.ch .grid{stroke:var(--line);stroke-width:1}
svg.ch .axis{stroke:var(--ink-3);stroke-width:1}
.group>.tablewrap>table>thead th{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.group>.tablewrap>table>thead th:first-child{z-index:5}
@media (min-width:1040px){.group>.tablewrap:not(.cscroll){overflow:clip}}
@media (max-width:1039px){.group>.tablewrap:not(.cscroll){max-height:80vh;overflow:auto}}
.cscroll{max-height:75vh;overflow:auto}
.cscroll th{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
.cscroll th:first-child{z-index:5}
.glos{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.glos summary{font-weight:600;cursor:pointer}
.glos dl{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;margin:10px 0;font-size:13px}
.glos dt{font-weight:600}.glos dd{margin:0;color:var(--ink-2)}
@media (max-width:640px){.glos dl{grid-template-columns:1fr}.glos dd{margin-bottom:6px}}
.rule label:has(select){flex-direction:column;align-items:stretch;gap:6px}
.rule .sw{justify-content:flex-start;gap:8px;cursor:pointer}
.rule .sw input{width:16px;height:16px;accent-color:var(--accent)}
.sugg{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px}
.sugg p{margin:0 0 4px;font-size:14px}.sugg .note{font-size:12px;margin:4px 0 0}
.stag{flex:none;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.rule select{padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
@media (max-width:640px){.sugg{flex-direction:column;gap:8px}}
.win{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.win h3{font-size:13px;margin:0 0 6px}
.win .hb{grid-template-columns:minmax(0,170px) 1fr 74px}
.win .hv{white-space:nowrap}
.win .note{margin-top:6px}
.cmph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.segb{background:var(--surface);border:0;padding:6px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
.segb+.segb{border-left:1px solid var(--line)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hgrp{margin-top:14px}.hgrp h3{font-size:13px;margin:0 0 6px}
.hb{display:grid;grid-template-columns:minmax(120px,230px) 1fr 70px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:3px;height:14px;display:block;overflow:hidden}
.ht i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hv{text-align:right}
.hb.infl .hn{font-weight:600;color:var(--warn)}
.hb.infl .hv{font-weight:600}
@media (max-width:640px){.hb{grid-template-columns:minmax(0,1fr) 70px}.hb .ht{grid-column:1/3;grid-row:2}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}

/* Criterios */
details.crit{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.crit>summary{padding:14px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.crit>summary::-webkit-details-marker{display:none}
details.crit>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
details.crit[open]>summary::before{transform:rotate(45deg)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:0 16px 16px}
.rule{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rule h3{color:var(--ink)}
.rule p{font-size:12px;color:var(--ink-3)}
.rule label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.rule input{width:84px;font:inherit;font-family:var(--mono);font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right}
.rule .ro{font-family:var(--mono);font-size:12px}

/* Estados */
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{padding:28px 20px;text-align:left}
.empty h2{margin-bottom:6px}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13px}
.banner.crit{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
footer.foot{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:4px}

@media (max-width:860px){
  .summary{grid-template-columns:minmax(0,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){
  .tiles{grid-template-columns:minmax(0,1fr)}
}

var FONT_LINK='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap';
var DEFAULT_CFG={
  pctPeor:75,
  flujoRojo:-10,
  compRojo:20,
  staleRojo:4,
  tamChico:50e9,tamGrande:500e9,

/* ================= Utilidades ================= */
var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var NF={};
function fx(v,d){ if(d===undefined)d=2; if(v===null||v===undefined||!isFinite(v))return '—'; if(!NF[d])NF[d]=new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); return NF[d].format(v); }
function sgn(v,d){ if(v===null||v===undefined||!isFinite(v))return '—'; return (v>0?'+':'')+fx(v,d===undefined?1:d); }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function D(s){ return Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)); }
function addDays(s,n){ return new Date(D(s)+n*864e5).toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((D(b)-D(a))/864e5); }
function fDate(s){ return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—'; }
function fDM(s){ return s?s.slice(8,10)+'/'+s.slice(5,7):'—'; }
function fShort(ms){ var d=new Date(ms); return d.getUTCDate()+' '+MESES[d.getUTCMonth()]; }
function fMonth(m){ return MESES[+m.slice(5,7)-1]; }
function num(v){ return (typeof v==='number'&&isFinite(v))?v:null; }
function baseName(n){ return String(n).replace(/\s+-\s+Clase\s+.*$/i,''); }
function fARS(v){
  if(v===null||v===undefined||!isFinite(v))return '—';
  if(v>=1e9)return '$ '+fx(v/1e9,0)+' mil M';
  return '$ '+fx(v/1e6,0)+' M';
}
var fARSc=fARS;

/* ================= Cálculos puros ================= */
function sumClases(rows,base){
  var mine=(rows||[]).filter(function(r){return baseName(r.fondo)===base;});
  var maxF=mine.reduce(function(m,r){return r.fecha&&r.fecha>m?r.fecha:m;},'');
  var lim=maxF?addDays(maxF,-7):'';
  var total=0,n=0;
  var clases=mine.map(function(r){
    var inc=!!(r.fecha&&r.fecha>=lim&&num(r.patrimonio)!==null);
    if(inc){total+=r.patrimonio;n++;}
    return {fondo:r.fondo,patrimonio:r.patrimonio,fecha:r.fecha,incluida:inc};
  });
  return {total:n?total:null,n:n,clases:clases};
}

/* Rendimiento del fondo del último cierre del año anterior hasta el cierre del mes de la inflación (mismo período que el IPC acumulado) */
function ytdTo(serie,mes){
  var y=+mes.slice(0,4),mo=+mes.slice(5,7);
  var fin=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10),ini=(y-1)+'-12-31';
  function last(lim){var r=null;(serie||[]).forEach(function(p){if(p.f<=lim&&p.v!==null&&isFinite(p.v)&&(r===null||p.f>r.f))r=p;});return r;}
  var a=last(ini),b=last(fin);
  if(!a||!b||daysBetween(a.f,ini)>7||daysBetween(b.f,fin)>7||a.v<=0)return null;
  return {desde:a.f,hasta:b.f,pct:(b.v/a.v-1)*100};
}

function volStats(serie){
  var s=[],i;
  for(i=0;i<(serie||[]).length;i++){
    var p=serie[i];
    if(p.v===null||p.v===undefined||!isFinite(p.v))continue;
    if(s.length&&p.v===s[s.length-1].v)continue;
    s.push(p);
  }
  if(s.length<30)return null;
  var last=s[s.length-1].f;
  function win(days){var cut=addDays(last,-days);return s.filter(function(p){return p.f>=cut;});}
  function vol(w){
    if(w.length<25)return null;
    var r=[],j;
    for(j=1;j<w.length;j++){var d=daysBetween(w[j-1].f,w[j].f); if(d>0)r.push((w[j].v/w[j-1].v-1)/d);}
    if(r.length<20)return null;
    var m=r.reduce(function(a,b){return a+b;},0)/r.length;
    var sd=Math.sqrt(r.reduce(function(a,b){return a+(b-m)*(b-m);},0)/(r.length-1));
    return sd*Math.sqrt(365)*100;
  }
  function ret(w){
    if(w.length<2)return null;
    var d=daysBetween(w[0].f,w[w.length-1].f);
    if(d<30)return null;
    return (Math.pow(w[w.length-1].v/w[0].v,365/d)-1)*100;
  }
  var w90=win(90),w365=win(365);
  return {d90:vol(w90),d365:w365.length>=150?vol(w365):null,ret90:ret(w90),n90:w90.length,n365:w365.length,last:last};
}

function nivel(v,umbral,dir){ /* dir 'ge' => v>=umbral; 'le' => v<=umbral. 2 = alarma, 0 = en orden */
  if(v===null||v===undefined)return null;
  if(dir==='le')return v<=umbral?2:0;
  return v>=umbral?2:0;
}

function analyze(b,cfg,tasas){
  var c=Object.assign({},DEFAULT_CFG,cfg||{});
  var f=b.ficha||{};
  var m={name:b.name,error:null,fetchedAt:b.fetchedAt};
  m.gestora=f.gestora;m.subcat=f.subcategoria;m.categoria=f.categoria;m.clase=f.clase;m.plazo=num(f.plazo_rescate);
  m.calif=f.calificacion;m.fechaDato=f.fecha;
  m.fees=(num(f.fee_gestion)||0)+(num(f.fee_depositaria)||0)+(num(f.gastos_gestion)||0);
  m.isMM=(f.categoria==='MERCADO DE DINERO');
  m.rend={d30:num(f.rend_30d),d90:num(f.rend_90d),ytd:num(f.rend_ytd),y1:num(f.rend_1y),
    tna:(num(f.rend_30d)!==null&&num(f.rend_30d_dias))?f.rend_30d/f.rend_30d_dias*365:null};
  m.patrimonio=b.patrimonio||{total:null,n:0,clases:[]};
  var tot=m.patrimonio.total;
  m.tamano=tot===null?null:(tot<c.tamChico?'Chico':(tot>=c.tamGrande?'Grande':'Mediano'));
  m.vol=b.vol||null;
  m.ytdInfl=b.ytdInfl||null;
  m.volRatio=(m.vol&&m.vol.d90!==null&&m.vol.d365)?m.vol.d90/m.vol.d365:null;
  m.expo={};((b.comp&&b.comp.rows)||[]).forEach(function(r){m.expo[r.tipo]=r.pct;});

  var k={},i;
  /* Rendimiento frente a fondos similares: peor cuartil en 2 de los últimos 3 meses */
  var mo=((b.peers&&b.peers.monthly)||[]).filter(function(x){return !x.mtd;}).slice(-3);
  var malos=mo.filter(function(x){return x.pct>=c.pctPeor;}).length;
  m.sost={malos:malos,n:mo.length};
  k.peers=mo.length?{sev:malos>=2?2:0,txt:'Bajo rendimiento: peor cuartil en '+malos+' de los últimos '+mo.length+' meses',val:malos+' de '+mo.length}:{sev:null,txt:'Sin datos de rendimiento frente a fondos similares',val:'—'};
  /* Flujos: fondo total (todas las clases) sobre su patrimonio total */
  var fl=b.flows||null;
  var worst=(fl&&tot&&num(fl.flujo)!==null)?fl.flujo/tot*100:null;
  k.flujos={sev:worst===null?null:nivel(worst,c.flujoRojo,'le'),
    txt:worst===null?'Sin datos de flujos':'Flujo neto de los últimos 30 días '+sgn(worst,1)+' % del patrimonio del fondo',
    val:worst===null?'—':sgn(worst,1)+' %',pct:worst,desde:fl?fl.desde:null,hasta:fl?fl.hasta:null};
  /* Composición */
  var cp=b.comp;
  if(cp&&cp.rows&&cp.rows.length&&cp.hasPrev){
    var top=cp.rows.reduce(function(a,r){return (a===null||Math.abs(r.delta)>Math.abs(a.delta))?r:a;},null);
    k.comp={sev:nivel(Math.abs(top.delta),c.compRojo,'ge'),txt:top.tipo+' '+sgn(top.delta,1)+' pp vs mes anterior',val:sgn(top.delta,1)+' pp',top:top};
  } else k.comp={sev:null,txt:'Sin composición del mes anterior',val:'—'};
  /* Datos */
  var ref=(b.fetchedAt||'').slice(0,10);
  var age=(ref&&f.fecha)?daysBetween(f.fecha,ref):null;
  k.datos={age:age,sev:age===null?null:nivel(age,c.staleRojo,'ge'),txt:age===null?'Sin fecha de dato':'Dato del '+fDate(f.fecha)+' ('+age+' días)',val:age===null?'—':age+' d'};
  m.checks=k;

  /* Señal de revisión de salida: 3 condiciones */
  var cond=[
    {id:'c1',ok:malos>=2,label:'Bajo rendimiento sostenido frente a fondos similares (2 de los últimos 3 meses)',val:mo.length?malos+' de '+mo.length:'—'},
    {id:'c2',ok:(worst!==null&&worst<=c.flujoRojo),label:'Retiros netos de al menos el '+fx(Math.abs(c.flujoRojo),0)+' % del patrimonio en 30 días',val:worst===null?'—':sgn(worst,1)+' %'},
    {id:'c3',ok:k.comp.sev===2,label:'Cambio grande en la composición de su cartera (≥ '+c.compRojo+' pp en algún tipo de activo)',val:k.comp.val||'—'}
  ];
  var aplic=cond.filter(function(x){return !x.na;});
  var n=aplic.filter(function(x){return x.ok;}).length;
  m.exit={n:n,total:aplic.length,cond:cond,nivel:n>=c.revisarMin?'revisar':'ok'};

  /* Alarmas: solo las que sonaron */
  m.alarmas=CHK.filter(function(x){var kk=k[x[0]];return kk&&kk.sev===2;}).map(function(x){return {id:x[0],label:x[1],txt:k[x[0]].txt,val:k[x[0]].val};});
  m.sinDato=CHK.filter(function(x){var kk=k[x[0]];return kk&&kk.sev===null&&!kk.na;}).map(function(x){return x[1];});
  m.rank=(m.exit.nivel==='revisar'?100:0)+m.alarmas.length;
  m.sev=m.alarmas.length?2:0;

  return m;
}

/* Alternativa: solo entre los fondos de la propia cartera con el mismo plazo de rescate */
function assignAlt(models){
  models.forEach(function(m){
    var otros=models.filter(function(x){return x!==m&&x.plazo===m.plazo&&x.exit.nivel!=='revisar';});
    if(!otros.length){m.alt={tipo:'sin_pares'};return;}
    var best=null;
    otros.forEach(function(x){ if(x.rend.d90!==null&&(best===null||x.rend.d90>best.rend.d90))best=x; });
    var mine=m.rend.d90;
    if(best&&mine!==null&&best.rend.d90>mine)m.alt={tipo:'mejor',a:{fondo:best.name,rend90:best.rend.d90,plazo:best.plazo},delta:best.rend.d90-mine};
    else m.alt={tipo:'lider'};
  });
}

var OTROS_MAX=60;
/* ===== Otros fondos: candidatos T+1 de afuera de la cartera ===== */
function candidatosDe(rk,ownBases){
  /* rk: {d30:[rows],d90:[rows],ytd:[rows]} de ranking_fondos. Una fila por clase; se queda con la clase que más rindió a 90 días de cada fondo. */
  var byClass={};
  ['d30','d90','ytd'].forEach(function(k){
    (rk[k]||[]).forEach(function(r){
      if(!r||!r.fondo||/Ley\s*N/i.test(r.fondo))return;
      var o=byClass[r.fondo]||(byClass[r.fondo]={fondo:r.fondo,clase:r.clase||null,d30:null,d90:null,ytd:null});
      if(num(r.return_pct)!==null)o[k]=r.return_pct;
    });
  });
  var own={};(ownBases||[]).forEach(function(b){own[b]=1;});
  var best={};
  Object.keys(byClass).forEach(function(n){
    var c=byClass[n],base=baseName(n);
    if(own[base]||c.d90===null||c.d90<=0)return;
    if(!best[base]||c.d90>best[base].d90)best[base]=c;
  });
  return Object.keys(best).map(function(b){var c=best[b];c.base=b;return c;}).sort(function(a,b){return b.d90-a.d90;});
}

async function loadOtros(){
  if(!MCP||S.otrosLoading)return;
  S.otrosLoading=true;S.otrosErr='';S.otros=null;renderAll();
  try{
    var own=S.bundles.filter(function(b){return !b.error;});
    var ownBases=FONDOS.map(baseName);
    var res=await Promise.all(['30d','90d','ytd'].map(function(p){return safe(function(){return callF('ranking_fondos',{subcategoria:'T+1',periodo:p,limite:300});});}));
    if(!res[1].ok||!res[1].v||!res[1].v.rows)throw new Error('ranking');
    var rk={d30:(res[0].ok&&res[0].v&&res[0].v.rows)||[],d90:res[1].v.rows,ytd:(res[2].ok&&res[2].v&&res[2].v.rows)||[]};
    var cands=candidatosDe(rk,ownBases);
    var gest={};own.forEach(function(b){if(b.ficha&&b.ficha.gestora)gest[String(b.ficha.gestora).toLowerCase()]=1;});
    var min=(S.cfg.usaTam?S.cfg.patMin:0)*1e9,done=[],i=0,CH=6;
    function enough(){
      var con=0,sin=0;
      done.forEach(function(c){ if(c.pat!==null&&c.pat>=min){ if(c.gestora&&gest[String(c.gestora).toLowerCase()])con++; else sin++; } });
      return con>=5&&sin>=5;
    }
    async function evalOne(c){
      var r=await Promise.all([safe(function(){return callF('buscar_fondos',{q:c.base,limite:50});}),safe(function(){return callF('ficha_fondo',{fondo:c.fondo});})]);
      var pat=(r[0].ok&&r[0].v&&r[0].v.data)?sumClases(r[0].v.data,c.base).total:null;
      var f=r[1].ok&&r[1].v?r[1].v:null;
      return {base:c.base,fondo:c.fondo,clase:c.clase||(f&&f.clase)||null,d30:c.d30,d90:c.d90,ytd:c.ytd,pat:pat,gestora:f?f.gestora:null,
        fees:f&&f.datos_actuales?((num(f.datos_actuales.fee_gestion)||0)+(num(f.datos_actuales.fee_depositaria)||0)+(num(f.datos_actuales.gastos_gestion)||0)):null,
        plazo:f&&f.datos_actuales?num(f.datos_actuales.plazo_rescate):null};
    }
    while(i<cands.length&&i<OTROS_MAX&&!enough()){
      var chunk=cands.slice(i,i+CH);i+=CH;
      var out=await Promise.all(chunk.map(evalOne));
      out.forEach(function(x){done.push(x);});
    }
    S.otros={gen:new Date().toISOString(),evaluados:done.length,total:cands.length,cands:done};
  }catch(e){
    S.otrosErr='No se pudo consultar el ranking de fondos. Probá actualizar en un momento.';
  }
  S.otrosLoading=false;renderAll();
}

function otrosSecciones(models,cfg){
  var c=Object.assign({},DEFAULT_CFG,cfg||{});
  var ownT1=models.filter(function(m){return m.plazo===1&&m.rend.d90!==null;}).sort(function(a,b){return b.rend.d90-a.rend.d90;});
  var best=ownT1[0]||null;
  var gest={};models.forEach(function(m){if(m.gestora)gest[String(m.gestora).toLowerCase()]=1;});
  var min=(c.usaTam?c.patMin:0)*1e9;
  var ok=((S.otros&&S.otros.cands)||[]).filter(function(x){return x.pat!==null&&x.pat>=min&&x.gestora&&(x.plazo===null||x.plazo===1);});
  var con=ok.filter(function(x){return gest[String(x.gestora).toLowerCase()];}).sort(function(a,b){return b.d90-a.d90;}).slice(0,5);
  var sin=ok.filter(function(x){return !gest[String(x.gestora).toLowerCase()];}).sort(function(a,b){return b.d90-a.d90;}).slice(0,5);
  return {best:best,con:con,sin:sin,ownT1:ownT1};
}

function ganoInfl(m){ return !!(m.ytdInfl&&m.ytdInfl.pct!==null&&m.ytdInfl.pct>INFLACION.ytd); }
function pickSugerencia(models,cfg){
  var c=Object.assign({},DEFAULT_CFG,cfg||{});
  var pool=c.soloT1?models.filter(function(m){return m.plazo===1;}):models.slice();
  var vs=pool.map(function(m){return m.rend.d90;}).filter(function(v){return v!==null;}).sort(function(a,b){return a-b;});
  var med=vs.length?(vs.length%2?vs[(vs.length-1)/2]:(vs[vs.length/2-1]+vs[vs.length/2])/2):null;
  var ok=pool.filter(function(m){
    return m.rend.d90!==null
      &&(!c.usaTam||(m.patrimonio.total!==null&&m.patrimonio.total>=c.patMin*1e9))
      &&(!c.usaAlarmas||m.alarmas.length===0)
      &&(!c.usaSost||(m.sost&&m.sost.n>0&&m.sost.malos===0))
      &&(!c.usaInfl||ganoInfl(m))
      &&(!c.pref||(m.expo[c.pref]||0)>0);
  });
  ok.sort(function(a,b){
    if(c.pref){var ea=a.expo[c.pref]||0,eb=b.expo[c.pref]||0;if(eb!==ea)return eb-ea;}
    return b.rend.d90-a.rend.d90;
  });
  return {m:ok[0]||null,med:med,pref:c.pref||'',nPool:pool.length,cfg:c};
}

function renderSugerencia(models){
  var r=pickSugerencia(models,S.cfg),m=r.m,c=r.cfg,txt;
  if(!r.nPool)return '';
  if(!m){
    txt='Hoy ningún fondo'+(c.soloT1?' T+1':'')+' cumple los criterios'+(r.pref?' con inversión en <b>'+esc(r.pref)+'</b>':'')+'.';
  } else {
    var det=['tiene un patrimonio de '+fARSc(m.patrimonio.total)];
    if(c.usaAlarmas)det.push('sin alarmas');
    if(c.usaSost)det.push('sin caer en el peor cuartil de su categoría en los últimos '+m.sost.n+' meses');
    if(c.usaInfl)det.push('le ganó a la inflación '+INFLACION.mes.slice(0,4)+' ('+sgn(m.ytdInfl.pct-INFLACION.ytd,1)+' pp)');
    txt='<b>'+esc(m.name)+'</b>'
      +(r.pref?', el de mayor inversión en <b>'+esc(r.pref)+'</b> ('+fx(m.expo[r.pref],0)+' % de su cartera)':'')
      +'. Rinde '+fx(m.rend.d90,2)+' % a 90 días'+(r.med!==null?' (mediana '+(c.soloT1?'de los T+1 de la cartera':'de la cartera')+': '+fx(r.med,2)+' %)':'')
      +', '+det.join(', ')+'.';
  }
  return '<section class="sugg" aria-label="Sugerencia"><span class="stag">Sugerencia</span><div><p>'+txt+'</p></div></section>';
}

/* ================= Gráficos SVG ================= */
function lineSvg(series,o){
  o=o||{};
  var W=560,H=o.h||210,m={l:46,r:92,t:12,b:26};
  var all=[];series.forEach(function(s){all=all.concat(s.pts);});
  if(all.length<2)return '<p class="muted">Sin datos suficientes.</p>';
  var x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  all.forEach(function(p){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y;});
  var pad=(y1-y0)*0.14||Math.abs(y1)*0.02||1;y0-=pad;y1+=pad;
  function sx(x){return m.l+(x-x0)/((x1-x0)||1)*(W-m.l-m.r);}
  function sy(y){return H-m.b-(y-y0)/((y1-y0)||1)*(H-m.t-m.b);}
  var g='',i;
  for(i=0;i<4;i++){
    var v=y0+(y1-y0)*i/3,yy=sy(v).toFixed(1);
    g+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(m.l-6)+'" y="'+(+yy+4)+'" text-anchor="end">'+fx(v,o.d===undefined?1:o.d)+'</text>';
  }
  g+='<text x="'+m.l+'" y="'+(H-6)+'">'+fShort(x0)+'</text><text x="'+(W-m.r)+'" y="'+(H-6)+'" text-anchor="end">'+fShort(x1)+'</text>';
  var labs=[];
  series.forEach(function(s){
    var d='M'+s.pts.map(function(p){return sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1);}).join('L');
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    var lp=s.pts[s.pts.length-1];
    g+='<circle cx="'+sx(lp.x).toFixed(1)+'" cy="'+sy(lp.y).toFixed(1)+'" r="3.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(s.name)+': '+fx(lp.y,o.d===undefined?1:o.d)+' ('+fShort(lp.x)+')</title></circle>';
    labs.push({y:sy(lp.y),t:s.name+' '+fx(lp.y,o.d===undefined?1:o.d)});
  });
  labs.sort(function(a,b){return a.y-b.y;});
  for(i=1;i<labs.length;i++){ if(labs[i].y-labs[i-1].y<13)labs[i].y=labs[i-1].y+13; }
  labs.forEach(function(l){g+='<text class="v" x="'+(W-m.r+8)+'" y="'+(l.y+4).toFixed(1)+'">'+esc(l.t)+'</text>';});
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Gráfico de líneas')+'">'+g+'</svg>';
}

function barSvg(items,o){
  o=o||{};
  var W=560,H=190,m={l:46,r:12,t:14,b:26};
  if(!items.length)return '<p class="muted">Sin datos suficientes.</p>';
  var ys=items.map(function(i){return i.v;}).concat([0]);
  (o.lines||[]).forEach(function(l){ys.push(l.v);});
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  var pad=(y1-y0)*0.1||1;y0-=pad;y1+=pad;
  function sy(y){return H-m.b-(y-y0)/((y1-y0)||1)*(H-m.t-m.b);}
  var bw=(W-m.l-m.r)/items.length,g='',i;
  for(i=0;i<4;i++){var v=y0+(y1-y0)*i/3,yy=sy(v).toFixed(1);g+='<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(m.l-6)+'" y="'+(+yy+4)+'" text-anchor="end">'+fx(v,0)+'</text>';}
  g+='<line class="axis" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(0).toFixed(1)+'" y2="'+sy(0).toFixed(1)+'"/>';
  (o.lines||[]).forEach(function(l){
    var yy=sy(l.v).toFixed(1);
    g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+l.color+'" stroke-width="1" stroke-dasharray="4 3"/>'+(l.label?'<text x="'+(W-m.r)+'" y="'+(+yy-4)+'" text-anchor="end" style="fill:'+l.color+'">'+esc(l.label)+'</text>':'');
  });
  items.forEach(function(it,idx){
    var x=m.l+idx*bw+bw*0.19,w=bw*0.62,yz=sy(0),yv=sy(it.v);
    g+='<rect x="'+x.toFixed(1)+'" y="'+Math.min(yz,yv).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(1,Math.abs(yv-yz)).toFixed(1)+'" rx="2" fill="'+it.color+'"><title>'+esc(it.label+': '+fx(it.v,1)+' %')+'</title></rect>';
    g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  var L=items[items.length-1];
  g+='<text class="v" x="'+(m.l+(items.length-0.5)*bw).toFixed(1)+'" y="'+(L.v>=0?sy(L.v)-5:sy(L.v)+13).toFixed(1)+'" text-anchor="middle">'+fx(L.v,1)+' %</text>';
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'Gráfico de barras')+'">'+g+'</svg>';
}

var INFLACION={mes:'2026-09',mensual:1.9,ult3:[2.1,1.7,1.9],ytd:23.6};

function renderCompare(models){
  var k=S.cmp||'d90';
  var vals=models.map(function(m){return m.rend[k];}).filter(function(v){return v!==null;});
  var infV=inflPeriodo(k);
  var mx=Math.max.apply(null,vals.concat([infV===null?0:infV,0.0001]));
  var groups={};
  models.forEach(function(m){var g=m.plazo===null?99:m.plazo;(groups[g]=groups[g]||[]).push(m);});
  var seg='<div class="seg" role="group" aria-label="Período">'+CMP.map(function(c){return '<button class="segb" data-act="cmp" data-p="'+c[0]+'" aria-pressed="'+(k===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>';
  var body=Object.keys(groups).sort(function(a,b){return a-b;}).map(function(g){
    var arr=groups[g].slice().sort(function(a,b){var x=a.rend[k],y=b.rend[k];return (y===null?-1e9:y)-(x===null?-1e9:x);});
    var vs=arr.map(function(m){return m.rend[k];}).filter(function(v){return v!==null;}).sort(function(a,b){return a-b;});
    var med=vs.length?(vs.length%2?vs[(vs.length-1)/2]:(vs[vs.length/2-1]+vs[vs.length/2])/2):null;
    var items=arr.map(function(m){return {m:m,v:m.rend[k]};});
    if(infV!==null){items.push({infl:true,v:infV});items.sort(function(a,b){return (b.v===null?-1e9:b.v)-(a.v===null?-1e9:a.v);});}
    var rows=items.map(function(it){
      var v=it.v,w=v===null?0:Math.max(0,v)/mx*100;
      if(it.infl)return '<div class="hb infl"><span class="hn">Inflación ('+MESES[+INFLACION.mes.slice(5,7)-1]+'-'+INFLACION.mes.slice(2,4)+')</span><span class="ht"><i style="width:'+w.toFixed(1)+'%;background:var(--warn)"></i></span><span class="hv mono">'+fx(v,2)+' %</span></div>';
      var m=it.m,rev=m.exit.nivel==='revisar';
      return '<div class="hb"><span class="hn">'+esc(m.name)+'</span><span class="ht"><i style="width:'+w.toFixed(1)+'%;'+(rev?'background:var(--crit)':'')+'"></i></span><span class="hv mono">'+(v===null?'—':fx(v,2)+' %')+'</span></div>';
    }).join('');
    return '<div class="hgrp"><h3>'+esc(plazoLabel(+g===99?null:+g))+(med!==null?' <span class="muted">· mediana de la cartera '+fx(med,2)+' %</span>':'')+'</h3>'+rows+'</div>';
  }).join('');
  return '<section class="panel cmp" aria-label="Comparativo de rendimiento"><div class="cmph"><h2>Rendimiento de todos los fondos</h2>'+seg+'</div>'+body+'<p class="note">Rendimiento del período, ordenado dentro de cada grupo de plazo de rescate. En naranja, la inflación del mismo período (hasta el mes del último dato); en rojo, los fondos en "Revisar salida".</p></section>';

function renderComposicion(models){
  var data=models.map(function(m){var b=S.bundles.filter(function(x){return x.name===m.name;})[0]||{};return {m:m,rows:(b.comp&&b.comp.rows)||[],hasPrev:!!(b.comp&&b.comp.hasPrev),prev:(b.comp&&b.comp.prevSnapshot)||null};});
  data.sort(function(x,y){var a=x.m.plazo===null?99:x.m.plazo,b=y.m.plazo===null?99:y.m.plazo;return a-b;});
  var tot={};
  data.forEach(function(d){d.rows.forEach(function(r){tot[r.tipo]=(tot[r.tipo]||0)+r.pct;});});
  var tipos=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];});
  if(!tipos.length)return '<div class="panel empty"><h2>Composición</h2><p class="muted">Sin datos de composición disponibles.</p></div>';
  var head='<tr><th scope="col" style="text-align:left">Fondo</th><th scope="col" style="text-align:center">Rescate</th>'+tipos.map(function(t){return '<th scope="col" style="white-space:normal;min-width:84px">'+esc(t)+'</th>';}).join('')+'<th scope="col" style="white-space:normal;min-width:70px">Otros (&lt; 1 %)</th></tr>';
  var rows=data.map(function(d){
    var map={},sum=0;
    d.rows.forEach(function(r){map[r.tipo]=r;sum+=r.pct;});
    var cells=tipos.map(function(t){
      var r=map[t];
      if(!r)return '<td class="mono muted">—</td>';
      var v=r.pct,dl=d.hasPrev?r.delta:null;
      if(v<0.05&&(dl===null||Math.abs(dl)<0.5))return '<td class="mono muted">—</td>';
      var a=Math.round(Math.min(v,100)*0.45),big=dl!==null&&Math.abs(dl)>=S.cfg.compRojo;
      return '<td class="mono" style="background:color-mix(in srgb,var(--accent) '+a+'%,transparent)'+(big?';box-shadow:inset 0 0 0 2px var(--crit)':'')+'">'+fx(v,1)+' %'+(dl!==null?'<br><span class="dl'+(big?' big':'')+'">('+sgn(dl,1)+' pp)</span>':'')+'</td>';
    }).join('');
    var otros=Math.max(0,100-sum);
    return '<tr><td><span class="nm" style="font-weight:600">'+esc(d.m.name)+'</span><br><span class="muted" style="font-size:12px">'+esc(d.m.subcat||'')+'</span></td><td style="text-align:center"><span class="pill neutral" style="font-family:var(--sans)">'+(d.m.plazo===null?'—':'T+'+d.m.plazo)+'</span></td>'+cells+'<td class="mono muted">'+(otros>=0.5?fx(otros,1)+' %':'—')+'</td></tr>';

var INFL={};
function callF(tool,input){
  var key=tool+'|'+JSON.stringify(input);
  if(INFL[key])return INFL[key];
  var p=(async function(){
    var r=await MCP.callTool(SERVER,tool,input,{cache:{staleTime:300000,gcTime:900000}});
    var pl=r.payload;
    if(typeof pl==='string'){try{pl=JSON.parse(pl);}catch(e){}}
    return pl;
  })();
  INFL[key]=p;
  p.then(function(){setTimeout(function(){delete INFL[key];},0);},function(){delete INFL[key];});
  return p;
}
async function safe(fn){ try{return {ok:true,v:await fn()};}catch(e){return {ok:false,e:e};} }

function slimBundle(name,R){
  var fi=R.ficha.v,da=fi.datos_actuales||{},me=fi.metricas||{};
  var b={name:name,fetchedAt:new Date().toISOString()};
  b.ficha={gestora:fi.gestora,subcategoria:fi.subcategoria,clase:fi.clase,categoria:da.categoria,fecha:da.fecha,patrimonio:da.patrimonio,calificacion:da.calificacion,
    fee_gestion:da.fee_gestion,fee_depositaria:da.fee_depositaria,gastos_gestion:da.gastos_gestion,plazo_rescate:da.plazo_rescate,
    rend_30d:me.rend_30d,rend_30d_dias:me.rend_30d_dias,rend_90d:me.rend_90d,rend_ytd:me.rend_ytd,rend_1y:me.rend_1y};
  var base=baseName(name);
  var rows=(R.cls.ok&&R.cls.v&&R.cls.v.data)||[];
  b.patrimonio=sumClases(rows,base);
  if(R.peers.ok&&R.peers.v){
    var p=R.peers.v,ld=p.last_date||da.fecha||'';
    var cut=ld?addDays(ld,-185):'';
    var pick=function(a){return (a||[]).filter(function(x){return x.fecha>=cut;}).map(function(x){return {f:x.fecha,v:x.vcp_norm};});};
    b.peers={lastDate:ld,n:p.n_funds_categoria,
      series:{fund:pick(p.series&&p.series.fund),cat:pick(p.series&&p.series.category)},
      returns:(p.period_returns||[]).filter(function(x){return ['1m','3m','ytd','1y'].indexOf(x.period)>=0;}).map(function(x){return {p:x.period,fund:x.fund,med:x.category_median,pct:x.percentile,rank:x.rank,n:x.n_funds};}),
      monthly:(p.monthly_returns||[]).slice(-5).map(function(x){return {m:x.month,fund:x.fund,med:x.category_median,pct:x.percentile,rank:x.rank,n:x.n_funds,mtd:!!x.mtd};})};
  } else b.peers=null;
  if(R.comp.ok&&R.comp.v&&R.comp.v.rows){
    var c=R.comp.v;
    b.comp={hasPrev:!!c.has_prev,prevSnapshot:c.prev_snapshot,divergente:!!c.divergente,
      rows:c.rows.filter(function(r){return r.fund_pct>=1||(r.prev_pct||0)>=1||r.median_pct>=1;}).map(function(r){return {tipo:r.tipo,pct:r.fund_pct,med:r.median_pct,prev:r.prev_pct||0,delta:r.delta_pct||0};})};
  } else b.comp=null;
  if(R.serie.ok&&R.serie.v&&R.serie.v.data){
    var sr=R.serie.v.data.map(function(x){return {f:x.fecha,v:x.vcp};});
    b.vol=volStats(sr);
    b.ytdInfl=ytdTo(sr,INFLACION.mes);
  } else {b.vol=null;b.ytdInfl=null;}
  b.flows=R.flows||null;
  return b;
}

async function fetchBundle(name){
  var R={};
  var calls=await Promise.all([
    safe(function(){return callF('ficha_fondo',{fondo:name});}),
    safe(function(){return callF('buscar_fondos',{q:baseName(name),limite:50});}),
    safe(function(){return callF('rendimiento_vs_peers',{fondo:name});}),
    safe(function(){return callF('tenencias_vs_peers',{fondo:name});}),
    safe(function(){return callF('serie_fondo',{fondo:name,dias:420});})
  ]);
  R.ficha=calls[0];R.cls=calls[1];R.peers=calls[2];R.comp=calls[3];R.serie=calls[4];
  if(!R.ficha.ok||!R.ficha.v||!R.ficha.v.datos_actuales){
    return {name:name,error:R.ficha.ok?{code:'sin_datos'}:{code:R.ficha.e&&R.ficha.e.code,message:R.ficha.e&&R.ficha.e.message}};
  }
  var da=R.ficha.v.datos_actuales,sub=R.ficha.v.subcategoria,cl=R.ficha.v.clase;
  var extra=[];
  extra.push(fetchFlows(R.ficha.v.gestora,baseName(name),da.fecha).then(function(x){R.flows=x;}));
  await Promise.all(extra);
  return slimBundle(name,R);
}

async function fetchFlows(gestora,base,fecha){
  if(!gestora||!fecha)return null;
  var hasta=new Date().toISOString().slice(0,10),desde=addDays(hasta,-30);
  var r=await safe(function(){return callF('flujo_por_fondo',{gestora:gestora,from:desde,to:hasta});});
  if(!r.ok||!r.v||!r.v.rows)return null;
  var row=r.v.rows.filter(function(x){return x.fondo===base;})[0];
  return (row&&num(row.flujo_ars)!==null)?{desde:desde,hasta:hasta,flujo:row.flujo_ars}:null;
}

async function fetchTasas(){
  var r=await safe(function(){return callF('tasas_mercado',{});});
  if(!r.ok||!r.v||!r.v.tasas)return null;
  var t=r.v.tasas,d=r.v.dolares||{},br=r.v.brechas||{};
  function dol(x){return x&&num(x.valor)!==null?{valor:x.valor,fecha:x.fecha}:null;}
  return {fecha:r.v.fecha,
    caucion:t.caucion?{tna:t.caucion.tna,tea:t.caucion.tea,fecha:t.caucion.fecha}:null,
    tamar:t.tamar?{tna:t.tamar.tna,tea:t.tamar.tea,fecha:t.tamar.fecha}:null,
    ccl:dol(d.ccl),oficial:dol(d.oficial_a3500),brechaCclOficial:num(br.ccl_oficial)};
}

async function refreshAll(){
  if(S.loading)return;
  S.loading={done:0,total:FONDOS.length};S.fatal=null;S.msg='';S.bundles=[];S.otros=null;S.otrosErr='';renderAll();
  var tp=fetchTasas().then(function(t){S.tasas=t;});
  var idx=0,out=new Array(FONDOS.length);
  async function worker(){
    while(idx<FONDOS.length){
      var i=idx++;
      var b;
      try{b=await fetchBundle(FONDOS[i]);}catch(e){b={name:FONDOS[i],error:{code:e&&e.code}};}
      out[i]=b;S.loading.done++;
      S.bundles=out.filter(Boolean);renderAll();
    }
  }
  await Promise.all([worker(),worker(),worker(),tp]);
  S.bundles=out.filter(Boolean);
  var allErr=S.bundles.length&&S.bundles.every(function(b){return b.error;});
  if(allErr){S.fatal=errText(S.bundles[0].error);}
  S.loading=null;S.generatedAt=new Date().toISOString();
  S.msg=allErr?'':'Actualizado.';
  renderAll();
  if(!allErr)loadOtros();
}

/* ================= Foto descargable ================= */
function buildPhotoHtml(){
  var cssEl=document.getElementById('app-css'),jsEl=document.getElementById('app-js');
  if(!cssEl||!jsEl)return null;
  var snap={version:1,generatedAt:S.generatedAt,cfg:S.cfg,tasas:S.tasas,otros:S.otros,bundles:S.bundles.filter(function(b){return !b.error;})};
  var json=JSON.stringify(snap).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor de Fondos</title>'
    +'<link rel="stylesheet" href="'+FONT_LINK+'"><style>'+cssEl.textContent+'</style></head><body><div id="app" class="wrap"></div>'
    +'<script>window.__SNAPSHOT__='+json+';<\/script><script id="app-js">'+jsEl.textContent+'<\/script></body></html>';
}
async function descargarFoto(){
  if(!DL){S.msg='La descarga no está disponible en esta vista.';renderAll();return;}
  var html=buildPhotoHtml();
  if(!html){S.msg='No se pudo armar la foto.';renderAll();return;}
  var d=(S.generatedAt||new Date().toISOString()).slice(0,10).replace(/-/g,'');
  try{
    await DL.save({filename:'monitor-fondos-'+d+'.html',data:html});
    S.msg='Foto guardada. Es un archivo HTML que se abre con doble clic, sin conexión.';
  }catch(e){
    S.msg=(e&&e.code==='declined')?'Descarga cancelada.':'No se pudo descargar la foto ('+((e&&e.code)||'error')+').';
  }
  renderAll();
}

/* ================= Eventos y arranque ================= */
function saveCfg(){ try{localStorage.setItem('mfondos.cfg',JSON.stringify(S.cfg));}catch(e){} }
function loadCfg(){ try{var s=localStorage.getItem('mfondos.cfg');if(s)S.cfg=Object.assign({},DEFAULT_CFG,JSON.parse(s));}catch(e){} }

function bind(){
  var el=document.getElementById('app');
  el.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-act]');if(!t)return;
    var a=t.getAttribute('data-act');
    if(a==='open'){var n=t.getAttribute('data-n');S.open[n]=!S.open[n];renderAll();}
    else if(a==='sort'){var k=t.getAttribute('data-k');if(S.sort.key===k)S.sort.dir*=-1;else{S.sort.key=k;S.sort.dir=(k==='name')?1:-1;}renderAll();}
    else if(a==='cmp'){S.cmp=t.getAttribute('data-p');renderAll();}
    else if(a==='cmp2'){S.cmp2=t.getAttribute('data-p');renderAll();}
    else if(a==='tab'){S.tab=t.getAttribute('data-t');renderAll();}
    else if(a==='refresh'){refreshAll();}
    else if(a==='foto'){descargarFoto();}
  });
  el.addEventListener('change',function(ev){
    var t=ev.target;if(!t.getAttribute)return;
    var ks=t.getAttribute('data-cfgs'),kb=t.getAttribute('data-cfgb'),k=t.getAttribute('data-cfg'),id;
    if(ks){S.cfg[ks]=t.value;id='cfg-'+ks;}
    else if(kb){S.cfg[kb]=t.checked?1:0;id='cfg-'+kb;}
    else if(k){var v=parseFloat(t.value);if(!isFinite(v))return;S.cfg[k]=v;id='cfg-'+k;}
    else return;
    saveCfg();
    var opens=Array.prototype.map.call(document.querySelectorAll('details.crit'),function(d){return d.open;});
    renderAll();
    Array.prototype.forEach.call(document.querySelectorAll('details.crit'),function(d,i){if(opens[i])d.open=true;});
    var inp=document.getElementById(id);if(inp)inp.focus();
  });
}

async function getCap(name){
  try{ if(!window.claude||!window.claude.use)return null; return await window.claude.use(name); }catch(e){return null;}
}

async function boot(){
  bind();
  if(SNAP){
    S.mode='foto';S.cfg=Object.assign({},DEFAULT_CFG,SNAP.cfg||{});S.bundles=SNAP.bundles||[];S.tasas=SNAP.tasas||null;S.otros=SNAP.otros||null;S.generatedAt=SNAP.generatedAt;
    renderAll();return;
  }
  loadCfg();
  S.loading={done:0,total:FONDOS.length};renderAll();
  var caps=await Promise.all([getCap('mcp'),getCap('downloads')]);
  MCP=caps[0];DL=caps[1];S.canDownload=!!DL;S.loading=null;
  if(!MCP){S.fatal='nomcp';renderAll();return;}
  await refreshAll();
}

if(typeof module!=='undefined'&&module.exports){
  module.exports={analyze:analyze,candidatosDe:candidatosDe,inflPeriodo:inflPeriodo,ytdTo:ytdTo,pickSugerencia:pickSugerencia,assignAlt:assignAlt,volStats:volStats,sumClases:sumClases,baseName:baseName,DEFAULT_CFG:DEFAULT_CFG,lineSvg:lineSvg,barSvg:barSvg};
}
if(typeof document!=='undefined'){ if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot); else boot(); }
})();
